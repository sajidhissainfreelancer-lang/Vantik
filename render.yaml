services:
  - type: web
    name: rnexa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_ANON_KEY, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: BOLNA_API_KEY, sync: false}
      - {key: BOLNA_AGENT_ID, sync: false}
      - {key: MAX_CALLS_PER_CAMPAIGN, value: "5"}
